name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore Application.sln

      - name: Build solution
        run: dotnet build Application.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Application.sln --configuration Release --no-build
